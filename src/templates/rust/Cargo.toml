[package]
name = "{{FUNCTION_ID}}"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
function-kit = { path = "{{FUNCTION_KIT_PATH}}" }
picus-wasm-sdk = { path = "{{WASM_SDK_PATH}}" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
{{OPTIONAL_DEPENDENCIES}}
