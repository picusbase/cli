openapi: "3.0.3"
info:
  title: {{FUNCTION_NAME}}
  description: Scaffold contract for {{FUNCTION_NAME}}
  version: "1.0.0"
servers:
  - url: http://localhost:4396
security:
  - bearerAuth: []
paths:
  /functions/{{FUNCTION_ID}}/execute:
    post:
      x-picus-auth-mode: authenticated
      summary: Execute {{FUNCTION_NAME}} function
      operationId: execute{{SCHEMA_PREFIX}}
      tags: ["{{DOMAIN_TAG}}"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/{{SCHEMA_PREFIX}}_ExecuteRequest"
      responses:
        "200":
          description: Successful list response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/{{SCHEMA_PREFIX}}_ListResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/{{SCHEMA_PREFIX}}_ErrorResponse"
        "401":
          description: Unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    {{SCHEMA_PREFIX}}_ExecuteRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [list]
        page:
          type: integer
          default: 1
        limit:
          type: integer
          default: 20
    {{SCHEMA_PREFIX}}_Item:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    {{SCHEMA_PREFIX}}_ListResponse:
      type: object
      required: [data, page, limit, count]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/{{SCHEMA_PREFIX}}_Item"
        page:
          type: integer
        limit:
          type: integer
        count:
          type: integer
    {{SCHEMA_PREFIX}}_ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              nullable: true